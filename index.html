<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谭雪晴 | 3D美术作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background-color: #fff6e9;
            color: #443322;
            overflow-x: hidden;
        }
        /* 顶部橙色标题栏 */
        .top-bar {
            background: linear-gradient(90deg, #ff9b33, #ffb259);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap:12px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 3px 8px #ffb25977;
        }
        .top-dot{
            width:12px;height:12px;border-radius:50%;background:#fff7;
        }
        .top-title-box{
            background:#fff8;
            padding:4px 16px;
            border-radius:20px;
            font-weight:bold;
        }
        .top-space{flex-grow:1}
        /* 整体布局容器：左 + 中 + 右 */
        .wrap{
            display: grid;
            grid-template-columns: 220px 1fr 320px;
            gap:16px;
            padding:16px;
            min-height: calc(100vh - 56px);
        }
        /* 左侧侧边栏 */
        .sidebar{
            background:#fff;
            border-radius:20px;
            padding:16px 12px;
            box-shadow: 0 4px 12px #ffc27066;
            border:3px solid #ffddaa;
        }
        .sidebar-logo{
            width:72px;height:72px;margin:0 auto 16px;
            background:#ffb259;border-radius:20px;
            display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;
            border-radius: 999px;
        }
        .side-item{
            padding:12px 14px;
            margin:8px 0;
            border-radius:14px;
            cursor:pointer;
            transition:0.2s;
            font-weight:500;
            display:flex;align-items:center;gap:8px;
        }
        .side-item.active{
            background:#ff9b33;color:white;
        }
        .side-item:hover:not(.active){
            background:#ffe9cc;
        }
        /* 中间主窗口 */
        .main-panel{
            background:#fff;
            border-radius:20px;
            padding:20px;
            box-shadow: 0 4px 12px #ffc27066;
            border:3px solid #ffddaa;
        }
        .header-info{
            text-align:center;margin-bottom:20px;
        }
        .header-info img.avatar{
            width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #ffb259;
        }
        .header-info h2{margin-top:8px;color:#553a20}
        .header-info p{font-size:13px;color:#886644;margin-top:4px}
        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
            gap:14px;
        }
        .work-card{
            background:#fff9ee;
            border-radius:14px;
            overflow:hidden;
            border:2px solid #ffddaa;
            cursor:pointer;
            transition:0.25s;
            box-shadow:0 2px 6px #ffd29955;
        }
        .work-card:hover{
            transform: translateY(-4px);
            border-color:#ff9b33;
        }
        .work-card img{
            width:100%;height:120px;object-fit:cover;
        }
        .work-card .name{
            text-align:center;padding:6px 4px;font-size:12px;color:#664422;
            background:#ffddaa77;
        }
        /* 右侧预览面板 */
        .preview-panel{
            background:#fff;
            border-radius:20px;
            padding:16px;
            box-shadow: 0 4px 12px #ffc27066;
            border:3px solid #ffddaa;
            display:flex;
            flex-direction:column;
        }
        .preview-avatar{
            text-align:center;margin-bottom:12px;
        }
        .preview-avatar img{
            width:80px;height:80px;border-radius:50%;border:2px solid #ffb259;
        }
        .preview-img-box{
            flex-grow:1;
            border-radius:14px;
            overflow:hidden;
            background:#fff9ee;
            border:2px solid #ffddaa;
            margin:12px 0;
            display:flex;align-items:center;justify-content:center;
            min-height:260px;
        }
        #previewImg{
            max-width:100%;max-height:100%;object-fit:contain;
        }
        .preview-desc{
            padding:10px;background:#ffe9cc;border-radius:12px;font-size:13px;
            color:#664422;
        }
        /* 底部小装饰 */
        .deco{
            position:fixed;bottom:20px;left:24px;
        }
    </style>
</head>
<body>
    <!-- 顶部橙条 -->
    <div class="top-bar">
        <div class="top-dot"></div>
        <div class="top-dot"></div>
        <div class="top-dot"></div>
        <div class="top-title-box">谭雪晴</div>
        <div class="top-title-box">作品集</div>
        <div class="top-space"></div>
        <div class="top-title-box">+</div>
    </div>

    <div class="wrap">
        <!-- 左侧侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">🐱</div>
            <div class="side-item active" data-type="all">🌟 全部作品</div>
            <div class="side-item" data-type="prop">⚔️ 道具建模</div>
            <div class="side-item" data-type="scene">🏠 场景资产</div>
            <div class="side-item" data-type="char">👧 角色模型</div>
        </div>

        <!-- 中间主作品区 -->
        <div class="main-panel">
            <div class="header-info">
                <img class="avatar" src="【这里替换你的头像链接】">
                <h2>谭雪晴 | 3D美术作品集</h2>
                <p>PBR次世代建模｜3ds Max / Blender / Substance Painter｜游戏道具、场景资产</p>
            </div>
            <div class="grid" id="workGrid">
                <!-- =========在这里填你的所有作品========= -->
                <div class="work-card" data-type="scene" data-img="【作品图链接】" data-name="室内居家场景" data-info="3ds Max室内小场景，PBR材质渲染">
                    <img src="【作品图链接】">
                    <div class="name">室内居家场景</div>
                </div>
                <div class="work-card" data-type="prop" data-img="【作品图链接】" data-name="木椅道具" data-info="卡通手绘家具道具">
                    <img src="【作品图链接】">
                    <div class="name">木椅道具</div>
                </div>
                <div class="work-card" data-type="prop" data-img="【作品图链接】" data-name="长剑武器" data-info="次世代PBR武器">
                    <img src="【作品图链接】">
                    <div class="name">长剑武器</div>
                </div>
                <div class="work-card" data-type="prop" data-img="【作品图链接】" data-name="卡通小车" data-info="Q版载具资产">
                    <img src="【作品图链接】">
                    <div class="name">卡通小车</div>
                </div>
                <div class="work-card" data-type="prop" data-img="【作品图链接】" data-name="枪械道具" data-info="硬表面枪械拓扑烘焙">
                    <img src="【作品图链接】">
                    <div class="name">枪械道具</div>
                </div>
                <div class="work-card" data-type="scene" data-img="【作品图链接】" data-name="欧式小屋" data-info="卡通风格建筑场景">
                    <img src="【作品图链接】">
                    <div class="name">欧式小屋</div>
                </div>
                <div class="work-card" data-type="char" data-img="【作品图链接】" data-name="卡通角色" data-info="Q版角色手绘贴图">
                    <img src="【作品图链接】">
                    <div class="name">卡通角色</div>
                </div>
            </div>
        </div>

        <!-- 右侧预览窗口 -->
        <div class="preview-panel">
            <div class="preview-avatar">
                <img src="【这里替换你的头像链接】">
                <p style="text-align:center;font-weight:bold;margin-top:4px">谭雪晴 | 3D美术</p>
            </div>
            <div class="preview-img-box">
                <img id="previewImg" src="" alt="预览图">
            </div>
            <div class="preview-desc" id="previewText">
                点击左侧网格里的作品卡片，在这里查看大图和介绍
            </div>
        </div>
    </div>

    <script>
        const sideItems = document.querySelectorAll('.side-item');
        const cards = document.querySelectorAll('.work-card');
        const previewImg = document.getElementById('previewImg');
        const previewText = document.getElementById('previewText');

        // 侧边筛选
        sideItems.forEach(btn=>{
            btn.onclick = ()=>{
                sideItems.forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                const t = btn.dataset.type;
                cards.forEach(card=>{
                    if(t==='all' || card.dataset.type === t){
                        card.style.display="block";
                    }else{
                        card.style.display="none";
                    }
                })
            }
        })
        // 点击卡片，右侧预览更新
        cards.forEach(card=>{
            card.onclick = ()=>{
                previewImg.src = card.dataset.img;
                previewText.innerText = card.dataset.info;
            }
        })
    </script>
</body>
</html>
